name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test ./runtime/gateway/... ./runtime/identity/... ./runtime/policy-engine/...
      - run: test -z "$(gofmt -l runtime)"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: python -m ruff check apps/intelligence-engine tests
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s apps/intelligence-engine/tests -v
        env:
          PYTHONPATH: apps/intelligence-engine

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
