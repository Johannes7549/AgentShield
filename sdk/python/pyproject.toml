[project]
name = "agentshield-sdk"
version = "0.1.0"
description = "AgentShield Python client. Signs the raw body and sends it to the gateway."
requires-python = ">=3.11"
dependencies = ["cryptography>=43,<47"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
